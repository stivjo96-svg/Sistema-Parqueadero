<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Parqueadero</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="encabezado">
        <h1>Sistema de Parqueadero</h1>
        <p>Gestión y control de estacionamiento vehicular</p>
    </header>


    <main class="contenedor">

        <section class="tarjeta">

            <h2>Registrar ingreso</h2>

            <form id="formIngreso">

                <label for="placa">
                    Placa del vehículo
                </label>

                <input
                    type="text"
                    id="placa"
                    name="placa"
                    placeholder="Ejemplo: ABC-1234"
                    required
                >

                <button type="submit">
                    Registrar ingreso
                </button>

            </form>

            <p id="mensaje"></p>

        </section>


        <section class="tarjeta">

            <h2>Vehículos actualmente estacionados</h2>

            <div id="listaVehiculos">
                <p>Cargando vehículos...</p>
            </div>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>
